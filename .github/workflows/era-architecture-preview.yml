name: Publish Age I-V Architecture Contact Sheet
on:
  push:
    branches: [feature/civilisation-architecture-ages-i-v]
    paths:
      - tools/export_era_architecture_preview.py
      - .github/workflows/era-architecture-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Crop and label real sprite variants
        run: python tools/export_era_architecture_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-Age-I-V-Architecture-Preview
          path: docs/media/god_sandbox_architecture_ages_i_v.png
          retention-days: 30
      - name: Publish image on the development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/god_sandbox_architecture_ages_i_v.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: publish real early-era architecture preview [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
