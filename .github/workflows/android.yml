name: God Sandbox Android APK

on:
  push:
    branches: [main, dev/phase1-pixel-art]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Godot tests and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.5.2"
      GODOT_STATUS: "stable"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sudo apt-get update -qq
          sudo apt-get install -y unzip xvfb libgl1-mesa-dri

      - name: Download Godot editor and official export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o export.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q export.tpz -d extracted
          cp extracted/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          ./godot --headless --version

      - name: Configure Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore"             -storepass android -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=God Sandbox,C=GB"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate imports, simulation, renderer and touch controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          run_checked() {
            local label="$1"
            shift
            "$@" 2>&1 | tee "build/${label}.log"
            if grep -E 'SCRIPT ERROR|^ERROR:|FAILED' "build/${label}.log"; then
              exit 1
            fi
          }
          run_checked import ./godot --headless --editor --path . --import --quit
          run_checked simulation ./godot --headless --path . --script res://tests/simulation_test.gd
          run_checked rendering ./godot --headless --path . --script res://tests/rendering_test.gd
          run_checked input ./godot --headless --path . --script res://tests/input_test.gd
          run_checked smoke ./godot --headless --path . --quit-after 90

      - name: Capture actual GL Compatibility gameplay
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1800x24" ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/capture_world.gd 2>&1 | tee build/capture.log
          if grep -E 'SCRIPT ERROR|^ERROR:|FAILED' build/capture.log; then exit 1; fi
          test -s tests/captures/world-close.png

      - name: Export Android debug APK
        run: |
          mkdir -p build
          set -euo pipefail
          ./godot --headless --path . --export-debug "Android" build/GodSandbox-debug.apk 2>&1 | tee build/export.log
          if grep -E 'SCRIPT ERROR|^ERROR:' build/export.log; then exit 1; fi
          test -s build/GodSandbox-debug.apk
          ls -lh build/GodSandbox-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-Android-debug
          path: build/GodSandbox-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation logs and in-engine captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-Visual-validation
          path: |
            build/*.log
            tests/captures/*.png
          if-no-files-found: warn
          retention-days: 14
