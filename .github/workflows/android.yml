name: God Sandbox Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Godot tests and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.5.2"
      GODOT_STATUS: "stable"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sudo apt-get update -qq
          sudo apt-get install -y unzip

      - name: Download Godot editor and official export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o export.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q export.tpz -d extracted
          cp extracted/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          ./godot --headless --version

      - name: Configure Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore"             -storepass android -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=God Sandbox,C=GB"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project and check scripts
        run: ./godot --headless --editor --path . --import --quit

      - name: Run simulation regression tests
        run: ./godot --headless --path . --script res://tests/simulation_test.gd

      - name: Validate citizen movement, work animation and distribution
        run: |
          ./godot --headless --path . --script res://tests/construction_animation_test.gd
          ./godot --headless --path . --script res://tests/workforce_distribution_test.gd
          ./godot --headless --path . --script res://tests/food_survival_test.gd

      - name: Smoke-test main game scene
        run: ./godot --headless --path . --quit-after 30

      - name: Export Android debug APK
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/GodSandbox-debug.apk
          test -s build/GodSandbox-debug.apk
          ls -lh build/GodSandbox-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-Android-debug
          path: build/GodSandbox-debug.apk
          if-no-files-found: error
          retention-days: 14
