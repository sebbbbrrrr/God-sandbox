name: Publish God Sandbox building sprite sheets
on:
  push:
    branches: [feature/physical-objects-420-v1]
    paths:
      - tools/export_building_tiles.py
      - .github/workflows/building-tiles.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Render original building tiles
        run: python tools/export_building_tiles.py
      - uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-Building-Sprite-Sheets
          path: docs/media/*.png
          retention-days: 30
      - name: Commit preview images for direct viewing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/god_sandbox_buildings_24.png docs/media/god_sandbox_construction_tiles_60.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: publish actual building sprite sheets [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
