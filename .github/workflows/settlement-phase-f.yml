name: God Sandbox Phase F Settlement QA and Android

on:
  push:
    branches:
      - feature/phase-f-autonomous-settlements
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-f-settlements-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Godot 4.5.2 unified integration, smoke and Android APK export
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.5.2"
      GODOT_STATUS: "stable"
    steps:
      - uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sudo apt-get update -qq
          sudo apt-get install -y unzip
      - name: Download Godot editor and Android export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-$GODOT_STATUS"
          curl -fL --retry 3 "$BASE/Godot_v$GODOT_VERSION-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v$GODOT_VERSION-${GODOT_STATUS}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 "$BASE/Godot_v$GODOT_VERSION-${GODOT_STATUS}_export_templates.tpz" -o export.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.$GODOT_STATUS"
          unzip -p export.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.$GODOT_STATUS/android_debug.apk"
          ./godot --headless --version
      - name: Configure Android debug signing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=God Sandbox,C=GB"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Run Phase F and inherited Godot regression suites
        run: python3 scripts/qa/validate_settlement_phase_f.py --godot "$PWD/godot"
      - name: Measure multi-settlement CPU performance
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/settlement_benchmark.gd 2>&1 | tee /tmp/phase-f-benchmark.log
          if grep -Ei "SCRIPT ERROR|Parse Error|FAILED:" /tmp/phase-f-benchmark.log; then exit 1; fi
      - name: Export Android debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/GodSandbox-PhaseF-debug.apk
          test -s build/GodSandbox-PhaseF-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/GodSandbox-PhaseF-debug.apk
          unzip -tqq build/GodSandbox-PhaseF-debug.apk
          ls -lh build/GodSandbox-PhaseF-debug.apk
      - name: Upload Phase F debug APK and QA reports
        uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-PhaseF-Android-debug
          path: |
            build/GodSandbox-PhaseF-debug.apk
            docs/settlement-phase-f-validation.json
            docs/settlement-phase-f-benchmark.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-f-settlements-failure-logs
          path: |
            /tmp/god-sandbox-phase-f-qa/*.log
            /tmp/phase-f-benchmark.log
          if-no-files-found: warn
          retention-days: 7
