name: Premium Android UI QA
on:
  push:
    branches: [feature/android-premium-hud]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: premium-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    name: Godot 4.5.2 interaction, layout and real GL screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.5.2
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip
          mv Godot_v4.5.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import and run frontend regression
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/ui-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/ui-import.log
          for test in premium_hud_test premium_input_test premium_save_test input_test pinch_zoom_anchor_test unified_integration_test game_item_ui_test item_inspector_test item_catalogue_test physical_inventory_test toolmaking_test toolmaking_autonomy_test construction_test food_survival_test era_occupations_test simulation_test civilisation_calendar_lifecycle_test household_care_test citizen_ai_test; do
            ./godot --headless --path . --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            ! grep -E 'SCRIPT ERROR|Parse Error|FAILED:|ERROR:' "/tmp/$test.log"
          done
      - name: Capture actual phone and landscape UI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x1280x24' ./godot --path . --rendering-method gl_compatibility --script res://tests/capture_premium_hud.gd 2>&1 | tee /tmp/ui-capture.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FAILED:|ERROR:' /tmp/ui-capture.log
          test -s tests/captures/premium-portrait-terrain.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GodSandbox-Premium-UI-Screenshots
          path: |
            tests/captures/premium-*.png
            /tmp/ui-*.log
            /tmp/premium_*_test.log
          if-no-files-found: error
          retention-days: 14
  android:
    name: Godot 4.5.2 Android debug export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK and Godot export templates
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable
          curl -fL --retry 3 "$BASE/Godot_v4.5.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip
          mv Godot_v4.5.2-stable_linux.x86_64 godot
          chmod +x godot
          curl -fL --retry 3 "$BASE/Godot_v4.5.2-stable_export_templates.tpz" -o /tmp/export.tpz
          unzip -q /tmp/export.tpz -d /tmp/godot-export
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          cp /tmp/godot-export/templates/* "$HOME/.local/share/godot/export_templates/4.5.2.stable/"
      - name: Configure debug signing and export paths
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=God Sandbox,C=GB'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
      - name: Import, smoke test and export
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/android-ui-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android-ui-import.log
          ./godot --headless --path . --quit-after 30 2>&1 | tee /tmp/android-ui-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/android-ui-smoke.log
          mkdir -p build
          ./godot --headless --path . --export-debug Android build/GodSandbox-Premium-UI-debug.apk
          test -s build/GodSandbox-Premium-UI-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-Premium-UI-Android-debug
          path: build/GodSandbox-Premium-UI-debug.apk
          if-no-files-found: error
          retention-days: 14
