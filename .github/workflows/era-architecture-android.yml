name: God Sandbox Age I-V Android Export
on:
  push:
    branches: [feature/civilisation-architecture-ages-i-v]
    paths-ignore:
      - docs/media/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: age-architecture-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Age I-V architecture Android debug APK
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.5.2"
      GODOT_STATUS: "stable"
    steps:
      - uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK dependencies
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sudo apt-get update -qq
          sudo apt-get install -y unzip
      - name: Download Godot editor and Android export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o export.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q export.tpz -d extracted
          cp extracted/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=God Sandbox,C=GB"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import and export Android debug APK
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --import --quit
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/GodSandbox-Age-I-V-debug.apk
          test -s build/GodSandbox-Age-I-V-debug.apk
          ls -lh build/GodSandbox-Age-I-V-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-Age-I-V-Android-debug
          path: build/GodSandbox-Age-I-V-debug.apk
          if-no-files-found: error
          retention-days: 14
