name: Physical Objects 420 — Godot and Android QA

on:
  push:
    branches:
      - feature/physical-objects-420-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip
          mv Godot_v4.5.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import and parse project
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/physical-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/physical-import.log
      - name: Validate art atlas and existing simulation contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in physical_sprite_atlas_test construction_animation_test universal_construction_test physical_inventory_test item_inspector_test game_item_ui_test rendering_test; do
            echo "::group::$test"
            ./godot --headless --path . --script "res://tests/$test.gd" 2>&1 | tee "/tmp/physical-$test.log"
            ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|FAILED:' "/tmp/physical-$test.log"
            echo "::endgroup::"
          done
      - name: Main scene smoke test
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --quit-after 60 2>&1 | tee /tmp/physical-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/physical-smoke.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-art-420-qa
          path: /tmp/physical-*.log
          retention-days: 7

  android:
    name: Android ARM64 debug APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.5.2"
      GODOT_STATUS: "stable"
    steps:
      - uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK dependencies
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sudo apt-get update -qq
          sudo apt-get install -y unzip
      - name: Download Godot editor and Android export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o export.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q export.tpz -d extracted
          cp extracted/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=God Sandbox,C=GB"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import and export Android debug APK
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --import --quit
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/GodSandbox-PhysicalArt-debug.apk
          test -s build/GodSandbox-PhysicalArt-debug.apk
          ls -lh build/GodSandbox-PhysicalArt-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GodSandbox-PhysicalArt-Android-debug
          path: build/GodSandbox-PhysicalArt-debug.apk
          if-no-files-found: error
          retention-days: 14
